<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monnt Hub - Key System</title>

    <!-- Supabase JS Client v2 -->
    <script src="[suspicious link removed]"></script>
    <!-- Google reCAPTCHA -->
    <script src="[suspicious link removed]" async defer></script>
    <!-- Google Font -->
    <link href="[suspicious link removed]" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #162032;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --key-box-bg: #0f172a;
            --key-box-border: #334155;
            --blue-primary: #007aff;
            --blue-glow: rgba(0, 122, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .header-text {
            margin-bottom: 20px;
        }
        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--blue-primary);
        }
        .header-text p {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 🌐 ปุ่ม Google Login พร้อมโลโก้ SVG */
        .btn-google {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background-color: var(--key-box-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
            transition: all 0.2s ease;
        }
        .btn-google:hover {
            border-color: var(--blue-primary);
            transform: translateY(-1px);
        }

        .user-info-bar {
            background-color: var(--key-box-bg);
            border: 1px solid var(--key-box-border);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            word-break: break-all;
        }
        .btn-logout {
            background: none;
            border: none;
            color: #ef4444;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            min-height: 78px;
        }

        .btn-blue-3d {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #0084ff, #0052d4);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--blue-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-blue-3d:hover {
            transform: translateY(-2px);
        }

        .key-box {
            background-color: var(--key-box-bg);
            border: 2px dashed var(--key-box-border);
            padding: 14px;
            border-radius: 12px;
            margin: 14px 0;
        }
        .key-text {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--blue-primary);
            word-break: break-all;
            margin-bottom: 8px;
        }
        .btn-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-text">
        <h1>🔑 Monnt Hub Key System</h1>
        <p>ยืนยันตัวตนเพื่อรับคีย์ใช้งานฟรี (8 Hours Key)</p>
    </div>

    <!-- 🌐 1. หน้าด่านล็อกอิน Google (ถ้ายังไม่ล็อกอิน จะเห็นแค่ส่วนนี้) -->
    <div id="authSection" style="display: block;">
        <p style="font-size: 0.88rem; color: var(--text-sub); margin-bottom: 12px;">
            กรุณาเข้าสู่ระบบด้วย Google ก่อนเข้าสู่หน้ารับคีย์
        </p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            ดำเนินการต่อด้วย Google
        </button>
    </div>

    <!-- 🔑 2. หน้ากดรับคีย์เต็มรูปแบบ (เปิดขึ้นมาอัตโนมัติเมื่อล็อกอินสำเร็จ) -->
    <div id="keySection" style="display: none;">
        <div class="user-info-bar">
            <span id="userEmailDisplay">👤 ...</span>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div id="mainContent">
            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LfTP-ItAAAAAOhtEvGqoUzTgCjC9YC0x6-hc5KP"></div>
            </div>
            <button class="btn-blue-3d" id="btnGet" onclick="handleGetKey()">
                🔑 รับคีย์ (Get Key)
            </button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div id="keyBox" class="key-box" style="display: none;">
            <div id="keyDisplay" class="key-text"></div>
            <div id="timeBadge" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;"></div>
            <button class="btn-blue-3d btn-copy" onclick="copyKey()">📋 Copy Key (คัดลอกคีย์)</button>
        </div>
    </div>
</div>

<script>
    // 📌 ตั้งค่าการเชื่อมต่อ Supabase Client
    const SUPABASE_URL = "[suspicious link removed]";
    const SUPABASE_ANON_KEY = "sb_publishable_mMHZfdWQC_8jaIQi40QLww_cJJI6scB";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const KEY_LIFETIME_MS = 8 * 60 * 60 * 1000; // 8 ชั่วโมง
    let localUser = null;

    // 🔄 เช็กสถานะการล็อกอินทันทีเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
            localUser = session.user;
            showKeySection();
            checkExistingKey();
        } else {
            showAuthSection();
        }
    });

    // 🌐 เข้าสู่ระบบผ่าน Google OAuth
    async function loginWithGoogle() {
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.href
            }
        });
        if (error) alert("❌ ล็อกอินไม่สำเร็จ: " + error.message);
    }

    // 🚪 ออกจากระบบ
    async function logout() {
        await supabaseClient.auth.signOut();
        window.location.reload();
    }

    function showAuthSection() {
        document.getElementById("authSection").style.display = "block";
        document.getElementById("keySection").style.display = "none";
    }

    function showKeySection() {
        document.getElementById("authSection").style.display = "none";
        document.getElementById("keySection").style.display = "block";
        document.getElementById("userEmailDisplay").innerText = "👤 " + (localUser ? [นำลิงก์ที่น่าสงสัยออกแล้ว] : "");
    }

    // 🎲 สุ่มรหัสคีย์ 22 ตัวอักษร
    function generateRandomCode(length) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // ⚡ ฟังก์ชันสร้างและรับคีย์
    async function handleGetKey() {
        const statusDiv = document.getElementById("statusMsg");
        const btnGet = document.getElementById("btnGet");

        statusDiv.innerText = "";
        [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#ef4444";

        const recaptchaResponse = grecaptcha.getResponse();
        if (!recaptchaResponse) {
            statusDiv.innerText = "⚠️ กรุณาติ๊กยืนยัน reCAPTCHA ด้านบนก่อนครับ!";
            return;
        }

        btnGet.disabled = true;
        btnGet.innerText = "⏳ กำลังสร้างคีย์...";
        [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#f59e0b";
        statusDiv.innerText = "กำลังสร้างคีย์และบันทึกลงระบบ...";

        const randomPart = generateRandomCode(22);
        const fullKey = "MonntHub_8H-" + randomPart;
        const userEmail = localUser ? [นำลิงก์ที่น่าสงสัยออกแล้ว] : "Unknown";

        try {
            // บันทึกคีย์ลง Supabase
            const { data, error } = await supabaseClient
                .from('keys')
                .insert([
                    { key_code: fullKey, status: 'active', user_email: userEmail, claimed_by: userEmail }
                ]);

            if (error) {
                console.error(error);
                statusDiv.innerText = "❌ บันทึกคีย์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
                btnGet.disabled = false;
                btnGet.innerText = "🔑 รับคีย์ (Get Key)";
            } else {
                localStorage.setItem("monnt_saved_key", JSON.stringify({
                    key: fullKey,
                    timestamp: [นำลิงก์ที่น่าสงสัยออกแล้ว]()
                }));

                [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#10b981";
                statusDiv.innerText = "✅ สร้างคีย์สำเร็จแล้ว!";
                renderExistingKeyUI(fullKey, 8, 0);

                if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
            }
        } catch (err) {
            console.error(err);
            statusDiv.innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล";
            btnGet.disabled = false;
            btnGet.innerText = "🔑 รับคีย์ (Get Key)";
        }
    }

    // ⏱️ เช็กคีย์เดิมจาก localStorage
    function checkExistingKey() {
        const savedData = localStorage.getItem("monnt_saved_key");
        if (savedData) {
            try {
                const keyObj = JSON.parse(savedData);
                const elapsedTime = [นำลิงก์ที่น่าสงสัยออกแล้ว]() - keyObj.timestamp;

                if (elapsedTime < KEY_LIFETIME_MS) {
                    const remainingMs = KEY_LIFETIME_MS - elapsedTime;
                    const hrs = Math.floor(remainingMs / (1000 * 60 * 60));
                    const mins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                    renderExistingKeyUI(keyObj.key, hrs, mins);
                } else {
                    localStorage.removeItem("monnt_saved_key");
                }
            } catch (e) {
                localStorage.removeItem("monnt_saved_key");
            }
        }
    }

    function renderExistingKeyUI(keyCode, hrs, mins) {
        const mainContent = document.getElementById("mainContent");
        const keyBox = document.getElementById("keyBox");
        const keyDisplay = document.getElementById("keyDisplay");
        const timeBadge = document.getElementById("timeBadge");

        mainContent.innerHTML = `
            <div style="background-color: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4); color: #d97706; padding: 10px; border-radius: 12px; font-size: 0.88rem;">
                ⚠️ คุณมีคีย์เดิมที่ยังไม่หมดอายุอยู่แล้ว!
            </div>
            <div style="font-size: 1.8rem; margin: 6px 0;">👇</div>
        `;

        keyDisplay.innerText = keyCode;
        timeBadge.innerText = `⏱️ เวลาคีย์คงเหลือประมาณ: ${hrs} ชั่วโมง ${mins} นาที`;
        [นำลิงก์ที่น่าสงสัยออกแล้ว].display = "block";
    }

    // 📋 คัดลอกคีย์
    function copyKey() {
        const keyText = document.getElementById("keyDisplay").innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert("📋 คัดลอกคีย์เรียบร้อยแล้ว!");
        });
    }
</script>

    
<!-- ⚙️ ชุดปุ่มฟันเฟือง Debug Log (รวม HTML + CSS + JS ในจุดเดียว) -->
<style>
    .btn-debug-gear {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #1e293b;
        border: 2px solid #007aff;
        color: #fff;
        font-size: 1.4rem;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }
    .btn-debug-gear:hover { transform: rotate(45deg) scale(1.1); }
    .debug-modal {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
    }
    .debug-content {
        background: #0f172a; border: 1px solid #334155;
        border-radius: 16px; width: 100%; max-width: 500px;
        max-height: 80vh; display: flex; flex-direction: column;
        overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .debug-header {
        padding: 12px 16px; background: #1e293b;
        color: #38bdf8; font-weight: bold;
        display: flex; justify-content: space-between; align-items: center;
    }
    .btn-close-debug { background: none; border: none; color: #ef4444; font-size: 1.5rem; cursor: pointer; }
    .debug-log-list {
        padding: 12px; overflow-y: auto; flex: 1;
        font-family: monospace; font-size: 0.82rem;
        display: flex; flex-direction: column; gap: 8px;
    }
    .log-item { padding: 8px 10px; border-radius: 6px; word-break: break-all; }
    .log-item.error { background: rgba(239, 68, 68, 0.15); color: #f87171; border-left: 3px solid #ef4444; }
    .[นำลิงก์ที่น่าสงสัยออกแล้ว] { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-left: 3px solid #38bdf8; }
    .debug-footer { padding: 10px 16px; background: #1e293b; display: flex; gap: 10px; justify-content: flex-end; }
    .debug-footer button {
        padding: 6px 12px; border-radius: 8px; border: none;
        background: #007aff; color: #fff; font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }
</style>

<button class="btn-debug-gear" onclick="toggleDebugModal()" title="ดู Error Log">⚙️</button>

<div id="debugModal" class="debug-modal" style="display: none;">
    <div class="debug-content">
        <div class="debug-header">
            <span>🛠️ Debug & Error Log</span>
            <button class="btn-close-debug" onclick="toggleDebugModal()">×</button>
        </div>
        <div id="debugLogList" class="debug-log-list">
            <div class="log-item info">💡 ยังไม่มีข้อความ Error บันทึกอยู่</div>
        </div>
        <div class="debug-footer">
            <button onclick="copyDebugLogs()">📋 คัดลอก Log</button>
            <button onclick="clearDebugLogs()" style="background: #ef4444;">🗑️ ล้าง Log</button>
        </div>
    </div>
</div>

<script>
    const debugLogs = [];
    function addDebugLog(msg, type = 'error') {
        const time = new Date().toLocaleTimeString('th-TH');
        const logText = `[${time}] ${msg}`;
        debugLogs.push({ text: logText, type: type });
        const logListDiv = document.getElementById("debugLogList");
        if (logListDiv) {
            if (debugLogs.length === 1) logListDiv.innerHTML = "";
            const item = document.createElement("div");
            item.className = `log-item ${type}`;
            item.innerText = logText;
            logListDiv.appendChild(item);
            logListDiv.scrollTop = logListDiv.scrollHeight;
        }
    }
    window.addEventListener('error', (e) => {
        addDebugLog(`❌ Global Error: ${e.message} (${e.filename}:${e.lineno})`, 'error');
    });
    window.addEventListener('unhandledrejection', (e) => {
        addDebugLog(`❌ Unhandled Promise: ${e.reason}`, 'error');
    });
    const originalConsoleError = console.error;
    console.error = function(...args) {
        originalConsoleError.apply(console, args);
        addDebugLog(`❌ Console Error: ${args.join(' ')}`, 'error');
    };
    function toggleDebugModal() {
        const modal = document.getElementById("debugModal");
        [นำลิงก์ที่น่าสงสัยออกแล้ว].display = [นำลิงก์ที่น่าสงสัยออกแล้ว].display === "none" ? "flex" : "none";
    }
    function clearDebugLogs() {
        debugLogs.length = 0;
        document.getElementById("debugLogList").innerHTML = `<div class="log-item info">💡 ล้าง Log เรียบร้อยแล้ว</div>`;
    }
    function copyDebugLogs() {
        if (debugLogs.length === 0) { alert("ไม่มี Log ให้คัดลอก"); return; }
        const fullText = [นำลิงก์ที่น่าสงสัยออกแล้ว](l => l.text).join("\n");
        navigator.clipboard.writeText(fullText).then(() => { alert("📋 คัดลอก Debug Log เรียบร้อยแล้ว!"); });
    }
</script>

</body>
</html>
