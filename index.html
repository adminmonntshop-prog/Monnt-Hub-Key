    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #162032;
            --card-border: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;

            --key-box-border: #334155;
            --blue-primary: #007aff;
            --blue-glow: rgba(0, 122, 255, 0.35);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f4f6f9;
                --card-bg: #ffffff;
                --card-border: #e2e8f0;
                --text-main: #1e293b;
                --text-sub: #64748b;
                --key-box-bg: #f1f5f9;
                --key-box-border: #cbd5e1;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);

        .header-text {
            margin-bottom: 20px;
        }
        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--blue-primary);
        }
        .header-text p {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .btn-google {
            width: 100%;
            padding: 12px 18px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            background-color: var(--key-box-bg);
            color: var(--text-main);
            font-size: 0.95rem;

        }
        .btn-google:hover {
            border-color: var(--blue-primary);
            transform: translateY(-1px);
        }

        .user-info-bar {
            background-color: var(--key-box-bg);
            border: 1px solid var(--key-box-border);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            word-break: break-all;
        }
        .btn-logout {
            background: none;
            border: none;
            color: #ef4444;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 8px;
        }

        .recaptcha-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            min-height: 78px;

        .btn-blue-3d {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #0084ff, #0052d4);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--blue-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn-blue-3d:hover {
            transform: translateY(-2px);
        }
        .btn-blue-3d:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .key-box {
            background-color: var(--key-box-bg);
            border: 2px dashed var(--key-box-border);
            padding: 14px;
            border-radius: 12px;
            margin: 14px 0;
        }
        .key-text {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--blue-primary);
            word-break: break-all;
            margin-bottom: 8px;
        }
        .btn-copy {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            min-height: 20px;
        }
    </style>

<body>

<div class="container">
    <div class="header-text">
        <h1>🔑 Monnt Hub Key System</h1>
        <p>ยืนยันตัวตนเพื่อรับคีย์ใช้งานฟรี (8 Hours Key)</p>
    </div>

    <!-- 🌐 1. หน้าล็อกอิน Google -->
    <div id="authSection" style="display: block;">
        <p style="font-size: 0.88rem; color: var(--text-sub); margin-bottom: 12px;">
            กรุณาเข้าสู่ระบบด้วย Google ก่อนเข้าสู่หน้ารับคีย์
        </p>
        <button class="btn-google" onclick="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            ดำเนินการต่อด้วย Google
        </button>
    </div>

    <!-- 🔑 2. หน้ารับคีย์ -->
    <div id="keySection" style="display: none;">
        <div class="user-info-bar">
            <span id="userEmailDisplay">👤 ...</span>
            <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
        </div>

        <div id="mainContent">
            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LfTP-ItAAAAAOhtEvGqoUzTgCjC9YC0x6-hc5KP"></div>
            </div>
            <button class="btn-blue-3d" id="btnGet" onclick="handleGetKey()">
                🔑 รับคีย์ (Get Key)
            </button>
        </div>

        <div id="statusMsg" class="status-msg"></div>

        <div id="keyBox" class="key-box" style="display: none;">
            <div id="keyDisplay" class="key-text"></div>
            <div id="timeBadge" style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px;"></div>
            <button class="btn-blue-3d btn-copy" onclick="copyKey()">📋 Copy Key (คัดลอกคีย์)</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "[suspicious link removed]";
    const SUPABASE_ANON_KEY = "sb_publishable_mMHZfdWQC_8jaIQi40QLww_cJJI6scB";
    const KEY_LIFETIME_MS = 8 * 60 * 60 * 1000; // 8 ชั่วโมง

    let localUser = null;
    let supabaseClient = null;

    // ⚡ ฟังก์ชันดึง Supabase Client
    function getSupabaseClient() {
        if (!supabaseClient && typeof window.supabase !== 'undefined' && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
        return supabaseClient;
    }

    // 🌐 ฟังก์ชันล็อกอิน Google
    async function loginWithGoogle() {
        const client = getSupabaseClient();
        if (!client) {
            alert("❌ ไม่สามารถดึงสคริปต์ Supabase ได้\nโปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองใหม่อีกครั้งครับ");
            return;
        }

        try {
            const { error } = await client.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.href
                }
            });
            if (error) alert("❌ ล็อกอินไม่สำเร็จ: " + error.message);
        } catch (err) {
            alert("❌ เกิดข้อผิดพลาด: " + err.message);
        }
    }

    // 🚪 ฟังก์ชันออกจากระบบ
    async function logout() {
        const client = getSupabaseClient();
        if (client) {
            await client.auth.signOut();
        }
        window.location.reload();
    }

    function showAuthSection() {
        document.getElementById("authSection").style.display = "block";
        document.getElementById("keySection").style.display = "none";
    }

    function showKeySection() {
        document.getElementById("authSection").style.display = "none";
        document.getElementById("keySection").style.display = "block";
        const emailSpan = document.getElementById("userEmailDisplay");
        if (emailSpan && localUser) {
            emailSpan.innerText = "👤 " + ([นำลิงก์ที่น่าสงสัยออกแล้ว] || "User");
        }
    }

    // 🎲 สุ่มรหัสคีย์ 22 ตัวอักษร
    function generateRandomCode(length) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // ⚡ ฟังก์ชันสร้างและรับคีย์
    async function handleGetKey() {
        const statusDiv = document.getElementById("statusMsg");
        const btnGet = document.getElementById("btnGet");
        const client = getSupabaseClient();

        if (!client) {
            [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#ef4444";
            statusDiv.innerText = "❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้";
            return;
        }

        statusDiv.innerText = "";
        [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#ef4444";

        if (typeof grecaptcha !== 'undefined') {
            const recaptchaResponse = grecaptcha.getResponse();
            if (!recaptchaResponse) {
                statusDiv.innerText = "⚠️ กรุณาติ๊กยืนยัน reCAPTCHA ด้านบนก่อนครับ!";
                return;
            }
        }

        btnGet.disabled = true;
        btnGet.innerText = "⏳ กำลังสร้างคีย์...";
        [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#f59e0b";
        statusDiv.innerText = "กำลังสร้างคีย์และบันทึกลงระบบ...";

        const randomPart = generateRandomCode(22);
        const fullKey = "MonntHub_8H-" + randomPart;
        const userEmail = (localUser && [นำลิงก์ที่น่าสงสัยออกแล้ว]) ? [นำลิงก์ที่น่าสงสัยออกแล้ว] : "Unknown";

        try {
            const { data, error } = await client
                .from('keys')
                .insert([
                    { key_code: fullKey, status: 'active', user_email: userEmail, claimed_by: userEmail }
                ]);

            if (error) {
                console.error(error);
                [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#ef4444";
                statusDiv.innerText = "❌ บันทึกคีย์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง";
                btnGet.disabled = false;
                btnGet.innerText = "🔑 รับคีย์ (Get Key)";
            } else {
                localStorage.setItem("monnt_saved_key", JSON.stringify({
                    key: fullKey,
                    timestamp: [นำลิงก์ที่น่าสงสัยออกแล้ว]()
                }));

                [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#10b981";
                statusDiv.innerText = "✅ สร้างคีย์สำเร็จแล้ว!";
                renderExistingKeyUI(fullKey, 8, 0);

                if (typeof grecaptcha !== 'undefined') {
                    grecaptcha.reset();
                }
            }
        } catch (err) {
            console.error(err);
            [นำลิงก์ที่น่าสงสัยออกแล้ว].color = "#ef4444";
            statusDiv.innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล";
            btnGet.disabled = false;
            btnGet.innerText = "🔑 รับคีย์ (Get Key)";
        }
    }

    // ⏱️ เช็กคีย์เดิมจาก localStorage
    function checkExistingKey() {
        const savedData = localStorage.getItem("monnt_saved_key");
        if (savedData) {
            try {
                const keyObj = JSON.parse(savedData);
                const elapsedTime = [นำลิงก์ที่น่าสงสัยออกแล้ว]() - keyObj.timestamp;

                if (elapsedTime < KEY_LIFETIME_MS) {
                    const remainingMs = KEY_LIFETIME_MS - elapsedTime;
                    const hrs = Math.floor(remainingMs / (1000 * 60 * 60));
                    const mins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                    renderExistingKeyUI(keyObj.key, hrs, mins);
                } else {
                    localStorage.removeItem("monnt_saved_key");
                }
            } catch (e) {
                localStorage.removeItem("monnt_saved_key");
            }
        }
    }

    function renderExistingKeyUI(keyCode, hrs, mins) {
        const mainContent = document.getElementById("mainContent");
        const keyBox = document.getElementById("keyBox");
        const keyDisplay = document.getElementById("keyDisplay");
        const timeBadge = document.getElementById("timeBadge");

        if (mainContent) {
            mainContent.innerHTML = `
                <div style="background-color: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4); color: #d97706; padding: 10px; border-radius: 12px; font-size: 0.88rem; font-weight: 500;">
                    ⚠️ คุณมีคีย์เดิมที่ยังไม่หมดอายุอยู่แล้ว!
                </div>
                <div style="font-size: 1.8rem; margin: 6px 0;">👇</div>
            `;
        }

        if (keyDisplay) keyDisplay.innerText = keyCode;
        if (timeBadge) timeBadge.innerText = "⏱️ เวลาคีย์คงเหลือประมาณ: " + hrs + " ชั่วโมง " + mins + " นาที";
        if (keyBox) [นำลิงก์ที่น่าสงสัยออกแล้ว].display = "block";
    }

    // 📋 คัดลอกคีย์
    function copyKey() {
        const keyDisplay = document.getElementById("keyDisplay");
        if (!keyDisplay) return;
        const keyText = keyDisplay.innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert("📋 คัดลอกคีย์เรียบร้อยแล้ว!");
        }).catch(() => {
            alert("📋 คัดลอกคีย์เรียบร้อยแล้ว!");
        });
    }

    // 🔄 เช็กสถานะการล็อกอินเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', async () => {
        const client = getSupabaseClient();
        if (client) {
            try {
                const { data: { session } } = await client.auth.getSession();
                if (session && session.user) {
                    localUser = session.user;
                    showKeySection();
                    checkExistingKey();
                    return;
                }
            } catch (e) {
                console.error(e);
            }
        }
        showAuthSection();
    });
</script>
